en:
  site_settings:
    cardwell_community_enabled: "Turn on the Cardwell community plugin. Off restores Discourse's defaults for every part, with no rebuild."
    cardwell_theme_compile_timeout_seconds: "How long Discourse may spend compiling a theme's JavaScript before giving up. Discourse allows 15 seconds. The web worker ends any request at 30 seconds and a theme update spends about 5 of them outside the compile, so 24 leaves a margin and 25 leaves none. Runs on theme updates and on the first request after an upgrade, not on ordinary page views."
    cardwell_lucide_icon_pickers_enabled: "Icon pickers (category, sidebar link, group flair, badge) offer only the theme's Lucide icons, the ones whose names start with lucide-. Off offers Font Awesome again, with no rebuild. Icons already in use don't change either way."
    cardwell_initials_avatars_enabled: "Someone with no photo gets two initials from their name (Dana Whitfield shows DW) in the color Discourse gives them, instead of the first letter of their username. Off goes back to the username letter, with no rebuild. Photos are never touched."
    cardwell_message_names_enabled: "Names, not handles, in the lines a message keeps about its people (added, removed, left), in the screen-reader heading on each, on activity stream rows, and in the composer's \"hasn't been seen in a while\" warning. A group shows its display name when the viewer can see it. Off goes back to handles, with no rebuild."
    cardwell_cohort_space_sidebar_enabled: "A cohort space shows in the sidebar of everyone in its group: added when they join the group, removed when they leave and can no longer see it. Discourse's automatic groups (moderators, staff, admins, trust levels) don't count, so staff sidebars stay as they are. Off stops adding and removing; links already there stay."
    cardwell_cohort_space_categories: "The cohort and Thought Leaders segment spaces. Adding one puts it in the sidebar of everyone already in its groups. The cohort spaces script adds each new space here."
    cardwell_visit_source_enabled: "Records where members arrive from, for the week-two return report. Links in the activity summary and notification emails, and in web push notifications, carry ?cw_src=digest, notification or push, and each member gets one row per day per source: digest, notification, push, invite or reminder (from the portal's emails), or direct when they came on their own. Off sends links untagged and records nothing; rows already recorded stay."
